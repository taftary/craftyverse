[package]
name = "planet-crafter-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
fontdue = "0.9.4"
glam = { workspace = true }
# `spv-in` is required too: naga 30's glsl-in frontend fails to compile without it
naga = { version = "30.0.1", features = ["glsl-in", "spv-out", "spv-in"] }
vulkano = "0.35.2"
winit = "0.30.13"
